<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Van Gogh: Nature & Soul</title>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;600&family=Pretendard:wght@300;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold: #FFD700;
            --dark-blue: #0A0A1A;
            --soft-white: #f5f5f5;
        }

        body {
            margin: 0;
            font-family: 'Pretendard', sans-serif;
            background: var(--dark-blue);
            color: var(--soft-white);
            line-height: 1.8;
            overflow-x: hidden;
        }

        /* ✨ 배경 별 애니메이션 */
        .stars-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.5;
            animation: twinkle var(--duration) infinite ease-in-out;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.5); }
        }

        /* 🖼 메인 헤더 */
        header {
            height: 100vh;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            z-index: 1;
        }

        /* 이미지 출력 태그 */
        .header-img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            filter: brightness(0.6) contrast(1.1);
            z-index: -1;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0.1) 0%, rgba(10,10,26,0.8) 100%);
        }

        header h1 {
            position: relative;
            font-family: 'Noto Serif KR', serif;
            font-size: clamp(2.5rem, 10vw, 5rem);
            font-weight: 600;
            text-align: center;
            text-shadow: 0 10px 30px rgba(0,0,0,0.8);
            line-height: 1.2;
        }

        section {
            position: relative;
            padding: 100px 20px;
            max-width: 900px;
            margin: auto;
            z-index: 1;
        }

        h2 { font-family: 'Noto Serif KR', serif; font-size: 2.2rem; color: var(--gold); margin-bottom: 30px; }

        .video-container {
            margin: 40px 0;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .video-container video { width: 100%; display: block; }

        .book {
            background: rgba(255, 255, 255, 0.03);
            padding: 50px;
            border-radius: 20px;
            border-left: 4px solid var(--gold);
            backdrop-filter: blur(20px);
        }

        .fade { opacity: 0; transform: translateY(40px); transition: all 1.5s ease-out; }
        .fade.show { opacity: 1; transform: translateY(0); }

        /* 🎧 플레이 버튼 스타일 */
        #music-control {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 100;
            background: rgba(255, 215, 0, 0.2);
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            font-family: 'Pretendard', sans-serif;
            font-size: 0.9rem;
            transition: 0.3s;
        }
        #music-control:hover { background: var(--gold); color: #000; }

        footer { text-align: center; padding: 80px; color: #444; font-size: 0.8rem; }
    </style>
</head>

<body>

    <div class="stars-container" id="stars"></div>

    <header>
        <img src="starry_sky.png" alt="Van Gogh Starry Night" class="header-img">
        <div class="overlay"></div>
        <h1>자연 속,<br>고흐를 읽다</h1>
    </header>

    <button id="music-control">♪ Music On</button>
    <audio id="bgm" src="bgm.mp3" loop></audio>

    <section class="fade">
        <h2>고흐와 자연</h2>
        <p>빈센트 반 고흐에게 자연은 단순한 관찰의 대상이 아니었습니다. 요동치는 하늘과 바람에 흔들리는 들판을 통해 자신의 가장 깊은 감정을 쏟아냈습니다.</p>
        <div class="video-container">
            <video autoplay muted loop playsinline>
                <source src="nature.mp4" type="video/mp4">
            </video>
        </div>
    </section>

    <section class="fade">
        <div class="book">
            <h2>영혼의 편지</h2>
            <p>"결국 우리는 우리 자신의 영혼을 일깨워야 한다."<br><br>동생 테오와 나눈 편지 속에는 예술을 향한 갈망이 생생하게 담겨 있습니다.</p>
        </div>
    </section>

    <section class="fade" style="text-align: center; padding: 150px 0;">
        <h2 style="font-style: italic; color: white;">"나는 별을 볼 때마다 항상 꿈을 꾼다."</h2>
        <p style="color: var(--gold);">VINCENT VAN GOGH</p>
    </section>

    <footer><p>&copy; 2026 VAN GOGH ARCHIVE PROJECT</p></footer>

    <script>
        // 1. 별 생성 스크립트
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 100; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 3 + 'px';
            star.style.width = size;
            star.style.height = size;
            star.style.top = Math.random() * 100 + '%';
            star.style.left = Math.random() * 100 + '%';
            star.style.setProperty('--duration', Math.random() * 3 + 2 + 's');
            starsContainer.appendChild(star);
        }

        // 2. 음악 컨트롤 버튼
        const bgm = document.getElementById('bgm');
        const btn = document.getElementById('music-control');
        
        btn.addEventListener('click', () => {
            if (bgm.paused) {
                bgm.play();
                bgm.volume = 0.3;
                btn.innerText = "|| Pause";
            } else {
                bgm.pause();
                btn.innerText = "♪ Music On";
            }
        });

        // 3. 스크롤 애니메이션
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('show');
            });
        }, { threshold: 0.1 });
        document.querySelectorAll('.fade').forEach(el => observer.observe(el));
    </script>
</body>
</html>
