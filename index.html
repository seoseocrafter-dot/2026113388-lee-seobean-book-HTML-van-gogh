<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Van Gogh Nature</title>

<style>
body {
  margin: 0;
  font-family: 'Georgia', serif;
  background: #1C1C3C;
  color: #fff;
}

/* 🎬 공통 영상 */
video {
  width: 100%;
  height: 100vh;
  object-fit: cover;
}

/* 영상 섹션 */
.video-section {
  position: relative;
}

.overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
}

.video-text {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 2.5em;
  text-align: center;
}

/* 콘텐츠 */
section {
  padding: 100px 20px;
  max-width: 900px;
  margin: auto;
}

.book {
  background: rgba(42,42,90,0.8);
  padding: 30px;
  margin-top: 30px;
  border-left: 5px solid #FFD700;
  backdrop-filter: blur(10px);
  transition: 0.5s;
}

.book:hover {
  transform: scale(1.03);
}

/* 등장 효과 */
.fade {
  opacity: 0;
  transform: translateY(40px);
  transition: 1s;
}

.fade.show {
  opacity: 1;
  transform: translateY(0);
}

footer {
  text-align: center;
  padding: 40px;
  background: #111;
}
</style>
</head>

<body>

<!-- 🎬 첫 번째 영상 (별밤) -->
<div class="video-section">
  <video autoplay muted loop playsinline>
    <source src="starry-night.mp4" type="video/mp4">
  </video>
  <div class="overlay"></div>
  <div class="video-text">자연 속, 고흐를 읽다</div>
</div>

<!-- 🎧 음악 -->
<audio id="bgm" src="bgm.mp3" loop></audio>

<!-- 📖 설명 -->
<section class="fade">
  <h2>고흐와 자연</h2>
  <p>
    빈센트 반 고흐는 자연을 단순한 풍경이 아니라 감정의 언어로 표현했다.
    그의 하늘과 들판은 살아 움직인다.
  </p>
</section>

<!-- 📚 책 -->
<section class="fade">
  <h2>추천 책</h2>

  <div class="book">
    <h3>📚 반 고흐, 영혼의 편지</h3>
    <p>
      고흐가 동생 테오에게 보낸 편지 속에는  
      자연과 고통, 그리고 예술에 대한 깊은 감정이 담겨 있다.
    </p>
  </div>
</section>

<!-- 🎬 두 번째 영상 (자연 영상) -->
<div class="video-section">
  <video autoplay muted loop playsinline>
    <source src="nature.mp4" type="video/mp4">
  </video>
  <div class="overlay"></div>
  <div class="video-text">자연은 감정이 된다</div>
</div>

<!-- 💬 명언 -->
<section class="fade">
  <h2>고흐의 한마디</h2>
  <p>"나는 자연을 통해 감정을 표현한다."</p>
</section>

<footer>
  <p>© Van Gogh Nature Project</p>
</footer>

<script>
// 🎧 클릭하면 음악 재생
document.addEventListener('click', () => {
  const bgm = document.getElementById('bgm');
  bgm.volume = 0.3;
  bgm.play();
});

// ✨ 스크롤 등장 효과
const fades = document.querySelectorAll('.fade');

window.addEventListener('scroll', () => {
  fades.forEach(el => {
    const top = el.getBoundingClientRect().top;
    if (top < window.innerHeight - 100) {
      el.classList.add('show');
    }
  });
});
</script>

</body>
</html>
