<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Van Gogh: Nature & Soul</title>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;600&family=Pretendard:wght@300;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold: #FFD700;
            --dark-blue: #0A0A1A;
            --soft-white: #f5f5f5;
        }

        body {
            margin: 0;
            font-family: 'Pretendard', sans-serif;
            background: var(--dark-blue);
            color: var(--soft-white);
            line-height: 1.8;
            overflow-x: hidden;
        }

        /* ✨ 배경 반짝이는 별 & 별똥별 컨테이너 */
        #stars-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.5;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        /* 🌠 별똥별 애니메이션 */
        .shooting-star {
            position: absolute;
            width: 150px;
            height: 2px;
            background: linear-gradient(90deg, rgba(255,255,255,1), transparent);
            z-index: 5;
            opacity: 0;
            pointer-events: none;
        }

        @keyframes shoot {
            0% { transform: translateX(0) translateY(0) rotate(-45deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateX(-600px) translateY(600px) rotate(-45deg); opacity: 0; }
        }

        /* 🎬 메인 헤더: 다시 영상으로 변경 (구름 움직임 구현) */
        header {
            height: 100vh;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            z-index: 1;
        }

        header video {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            min-width: 100%; min-height: 100%;
            object-fit: cover;
            filter: brightness(0.5) contrast(1.2);
            z-index: -1;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0.1) 0%, rgba(10,10,26,0.8) 100%);
        }

        header h1 {
            position: relative;
            font-family: 'Noto Serif KR', serif;
            font-size: clamp(2.5rem, 10vw, 5rem);
            font-weight: 600;
            text-align: center;
            text-shadow: 0 10px 40px rgba(0,0,0,0.9);
            line-height: 1.2;
            animation: fadeInDown 2.5s ease-out;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        section {
            position: relative;
            padding: 120px 20px;
            max-width: 850px;
            margin: auto;
            z-index: 1;
        }

        h2 { font-family: 'Noto Serif KR', serif; font-size: 2.2rem; color: var(--gold); margin-bottom: 35px; }

        .video-container {
            margin: 50px 0;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .video-container video { width: 100%; display: block; }

        .book {
            background: rgba(255, 255, 255, 0.04);
            padding: 60px;
            border-radius: 25px;
            border-left: 5px solid var(--gold);
            backdrop-filter: blur(25px);
        }

        .fade { opacity: 0; transform: translateY(40px); transition: all 1.5s ease-out; }
        .fade.show { opacity: 1; transform: translateY(0); }

        /* 🎧 뮤직 컨트롤 플로팅 버튼 */
        #music-btn {
            position: fixed;
            bottom: 40px; right: 40px;
            z-index: 100;
            background: rgba(255, 215, 0, 0.15);
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            backdrop-filter: blur(15px);
            font-size: 0.9rem;
            letter-spacing: 1px;
            transition: all 0.3s;
        }
        #music-btn:hover { background: var(--gold); color: #000; transform: scale(1.05); }

        footer { text-align: center; padding: 100px; color: #444; font-size: 0.8rem; letter-spacing: 2px; }
    </style>
</head>

<body>

    <div id="stars-container"></div>

    <header>
        <video autoplay muted loop playsinline>
            <source src="starry_sky.mp4" type="video/mp4">
        </video>
        <div class="overlay"></div>
        <h1>자연 속,<br>고흐를 읽다</h1>
    </header>

    <button id="music-btn">♪ Play Music</button>
    <audio id="bgm" src="bgm.mp3" loop></audio>

    <section class="fade">
        <h2>고흐와 자연</h2>
        <p>빈센트 반 고흐에게 자연은 단순한 관찰의 대상이 아니었습니다. 요동치는 하늘과 바람에 흔들리는 들판을 통해 자신의 가장 깊은 감정을 쏟아냈습니다.</p>
        <div class="video-container">
            <video autoplay muted loop playsinline>
                <source src="nature.mp4" type="video/mp4">
            </video>
        </div>
    </section>

    <section class="fade">
        <div class="book">
            <h2>영혼의 편지</h2>
            <p>"결국 우리는 우리 자신의 영혼을 일깨워야 한다."<br><br>동생 테오와 나눈 편지 속에는 예술을 향한 갈망이 생생하게 담겨 있습니다.</p>
        </div>
    </section>

    <section class="fade" style="text-align: center; padding: 180px 0;">
        <h2 style="font-style: italic; color: white; border:none; font-size: 2.5rem;">"나는 별을 볼 때마다 항상 꿈을 꾼다."</h2>
        <p style="color: var(--gold); letter-spacing: 5px; margin-top: 20px;">VINCENT VAN GOGH</p>
    </section>

    <footer><p>&copy; 2026 VAN GOGH ARCHIVE PROJECT</p></footer>

    <script>
        // 1. 반짝이는 별 배경 생성
        const container = document.getElementById('stars-container');
        for (let i = 0; i < 120; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 2.5 + 'px';
            star.style.width = size;
            star.style.height = size;
            star.style.top = Math.random() * 100 + '%';
            star.style.left = Math.random() * 100 + '%';
            star.style.setProperty('--duration', Math.random() * 3 + 2 + 's');
            container.appendChild(star);
        }

        // 2. 별똥별(Shooting Star) 생성 로직
        function createShootingStar() {
            const sStar = document.createElement('div');
            sStar.className = 'shooting-star';
            sStar.style.top = Math.random() * 40 + '%'; // 위쪽 영역에서 생성
            sStar.style.left = Math.random() * 80 + 20 + '%'; // 오른쪽에서 왼쪽으로 가도록 시작점 설정
            sStar.style.animation = `shoot ${Math.random() * 1 + 1}s linear forwards`;
            container.appendChild(sStar);
            
            setTimeout(() => sStar.remove(), 2000);
        }

        // 4~7초 사이 랜덤하게 별똥별 발사
        setInterval(() => {
            if (Math.random() > 0.4) createShootingStar();
        }, 5000);

        // 3. 음악 컨트롤
        const bgm = document.getElementById('bgm');
        const btn = document.getElementById('music-btn');
        
        btn.addEventListener('click', () => {
            if (bgm.paused) {
                bgm.play();
                bgm.volume = 0.3;
                btn.innerText = "|| Pause Music";
            } else {
                bgm.pause();
                btn.innerText = "♪ Play Music";
            }
        });

        // 4. 스크롤 페이드 애니메이션
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('show');
            });
        }, { threshold: 0.1 });
        document.querySelectorAll('.fade').forEach(el => observer.observe(el));
    </script>
</body>
</html>
