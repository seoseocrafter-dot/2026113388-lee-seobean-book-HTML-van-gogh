<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vincent van Gogh: Letters to Theo</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;600&family=Pretendard:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #FFD700;
            --dark-blue: #0A0A1A;
            --soft-white: #f5f5f5;
        }

        body {
            margin: 0;
            font-family: 'Pretendard', sans-serif;
            background: var(--dark-blue);
            color: var(--soft-white);
            overflow-x: hidden;
        }

        /* ✨ 배경: 별 & 별똥별 애니메이션 */
        #star-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .shooting-star {
            position: absolute;
            width: 150px; height: 2px;
            background: linear-gradient(90deg, white, transparent);
            opacity: 0;
            z-index: 1;
        }

        @keyframes shoot {
            0% { transform: translate(0, 0) rotate(-45deg); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translate(-600px, 600px) rotate(-45deg); opacity: 0; }
        }

        /* 📖 레이아웃 */
        .container {
            position: relative;
            z-index: 10;
            max-width: 1000px;
            margin: 0 auto;
            padding: 100px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 책 섹션 */
        .book-section {
            display: flex;
            align-items: center;
            gap: 60px;
            margin-bottom: 100px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .book-cover {
            width: 320px;
            border-radius: 10px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            transition: transform 0.5s ease;
        }

        .book-cover:hover {
            transform: translateY(-20px) rotate(-3deg);
        }

        .book-info {
            max-width: 500px;
        }

        .book-tag {
            color: var(--gold);
            font-size: 0.9rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
            display: block;
        }

        h1 {
            font-family: 'Noto Serif KR', serif;
            font-size: 3rem;
            margin: 0 0 20px 0;
            line-height: 1.2;
        }

        .description {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #ccc;
            margin-bottom: 30px;
        }

        /* 🖋 명언 카드 */
        .quote-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 60px;
            border-radius: 30px;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }

        .quote-text {
            font-family: 'Noto Serif KR', serif;
            font-size: 1.8rem;
            line-height: 1.6;
            margin-bottom: 30px;
            position: relative;
        }

        .quote-text::before {
            content: '"';
            font-size: 5rem;
            position: absolute;
            top: -40px; left: 50%;
            transform: translateX(-50%);
            color: var(--gold);
            opacity: 0.3;
        }

        .author {
            color: var(--gold);
            font-weight: 600;
            letter-spacing: 3px;
        }

        /* 🎧 하단 음악 버튼 */
        #music-btn {
            position: fixed;
            bottom: 40px; right: 40px;
            background: rgba(255, 215, 0, 0.2);
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 15px 25px;
            border-radius: 50px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: 0.3s;
            z-index: 100;
        }

        #music-btn:hover { background: var(--gold); color: black; }

        @media (max-width: 768px) {
            h1 { font-size: 2.2rem; }
            .book-cover { width: 250px; }
        }
    </style>
</head>
<body>

    <div id="star-canvas"></div>

    <button id="music-btn">♪ Play Heartbeat</button>
    <audio id="bgm" src="bgm.mp3" loop></audio>

    <div class="container">
        <div class="book-section">
            <img src="gogh.jpg" alt="영혼의 편지 책 표지" class="book-cover">
            <div class="book-info">
                <span class="book-tag">출간 25주년 기념 개정판</span>
                <h1>반 고흐,<br>영혼의 편지</h1>
                <p class="description">
                    고흐의 불꽃같은 열망과 고독한 내면의 기록.<br>
                    30만 독자들이 사랑한 고흐의 편지를 담은 첫 번째 책입니다.
                </p>
                <div style="display: flex; gap: 20px;">
                    <div style="text-align: center;">
                        <div style="color: var(--gold); font-size: 1.5rem; font-weight: 600;">30만+</div>
                        <div style="font-size: 0.8rem; opacity: 0.6;">누적 독자</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="quote-card">
            <p class="quote-text">
                "우리에게 시도할 용기가 없다면<br>삶이 도대체 무슨 의미가 있겠니?"
            </p>
            <p class="author">— 동생 테오에게</p>
        </div>
    </div>

    <script>
        // 별 배경 및 별똥별 생성
        const canvas = document.getElementById('star-canvas');
        
        function createStar() {
            const star = document.createElement('div');
            star.style.position = 'absolute';
            star.style.background = 'white';
            star.style.borderRadius = '50%';
            star.style.width = Math.random() * 3 + 'px';
            star.style.height = star.style.width;
            star.style.top = Math.random() * 100 + '%';
            star.style.left = Math.random() * 100 + '%';
            star.style.opacity = Math.random();
            canvas.appendChild(star);
        }

        for (let i = 0; i < 150; i++) createStar();

        function createShootingStar() {
            const sStar = document.createElement('div');
            sStar.className = 'shooting-star';
            sStar.style.top = Math.random() * 50 + '%';
            sStar.style.left = Math.random() * 100 + '%';
            sStar.style.animation = 'shoot 1.5s linear forwards';
            canvas.appendChild(sStar);
            setTimeout(() => sStar.remove(), 1500);
        }

        setInterval(() => { if(Math.random() > 0.7) createShootingStar(); }, 3000);

        // 음악 재생
        const bgm = document.getElementById('bgm');
        const btn = document.getElementById('music-btn');
        btn.onclick = () => {
            if (bgm.paused) { bgm.play(); btn.innerText = "|| Pause"; }
            else { bgm.pause(); btn.innerText = "♪ Play Heartbeat"; }
        };
    </script>
</body>
</html>
