<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Van Gogh: Nature & Soul</title>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;600&family=Pretendard:wght@300;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold: #FFD700;
            --dark-blue: #0A0A1A;
            --soft-white: #f5f5f5;
        }

        body {
            margin: 0;
            font-family: 'Pretendard', sans-serif;
            background: var(--dark-blue);
            color: var(--soft-white);
            line-height: 1.8;
            overflow-x: hidden;
        }

        /* 🎬 메인 헤더: 별헤는 밤 영상 */
        header {
            height: 100vh;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        header video {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            min-width: 100%;
            min-height: 100%;
            object-fit: cover;
            z-index: -1;
            filter: brightness(0.6) contrast(1.2);
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0.1) 0%, rgba(10,10,26,0.7) 100%);
        }

        header h1 {
            position: relative;
            font-family: 'Noto Serif KR', serif;
            font-size: clamp(2.5rem, 10vw, 5rem);
            font-weight: 600;
            text-align: center;
            text-shadow: 0 10px 30px rgba(0,0,0,0.8);
            animation: fadeInDown 2.5s ease-out;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        section {
            padding: 100px 20px;
            max-width: 900px;
            margin: auto;
        }

        h2 {
            font-family: 'Noto Serif KR', serif;
            font-size: 2.2rem;
            color: var(--gold);
            margin-bottom: 30px;
        }

        /* 🎞 영상 카드 스타일 */
        .video-container {
            margin: 40px 0;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .video-container video {
            width: 100%;
            display: block;
        }

        /* 📖 책 소개 카드 */
        .book {
            background: rgba(255, 255, 255, 0.03);
            padding: 50px;
            border-radius: 20px;
            border-left: 4px solid var(--gold);
            backdrop-filter: blur(20px);
            transition: 0.5s;
        }

        .book:hover {
            background: rgba(255, 255, 255, 0.07);
            transform: translateY(-5px);
        }

        .fade {
            opacity: 0;
            transform: translateY(40px);
            transition: all 1.5s ease-out;
        }

        .fade.show {
            opacity: 1;
            transform: translateY(0);
        }

        .quote {
            font-family: 'Noto Serif KR', serif;
            font-size: 1.8rem;
            text-align: center;
            margin: 80px 0;
            color: var(--soft-white);
            font-style: italic;
        }

        footer {
            text-align: center;
            padding: 80px;
            color: #444;
            letter-spacing: 2px;
            font-size: 0.8rem;
        }
    </style>
</head>

<body>

    <header>
        <video autoplay muted loop playsinline>
            <source src="starry_sky.mp4" type="video/mp4">
        </video>
        <div class="overlay"></div>
        <h1>자연 속,<br>고흐를 읽다</h1>
    </header>

    <audio id="bgm" src="bgm.mp3" loop></audio>

    <section class="fade">
        <h2>고흐와 자연</h2>
        <p>
            빈센트 반 고흐에게 자연은 단순한 관찰의 대상이 아니었습니다. 
            그는 요동치는 하늘과 바람에 흔들리는 들판을 통해 자신의 가장 깊은 감정을 쏟아냈습니다.
        </p>
        
        <div class="video-container">
            <video autoplay muted loop playsinline>
                <source src="nature.mp4" type="video/mp4">
            </video>
        </div>
    </section>

    <section class="fade">
        <div class="book">
            <h2>영혼의 편지</h2>
            <p>
                "결국 우리는 우리 자신의 영혼을 일깨워야 한다."<br><br>
                동생 테오와 나눈 편지 속에는 예술을 향한 지독한 갈망과 
                자연의 아름다움을 찬양하는 고흐의 목소리가 생생하게 담겨 있습니다.
            </p>
        </div>
    </section>

    <section class="fade">
        <div class="quote">"나는 별을 볼 때마다 항상 꿈을 꾼다."</div>
        
        <div style="max-width: 400px; margin: 0 auto;" class="video-container">
            <video autoplay muted loop playsinline style="filter: hue-rotate(10deg);">
                <source src="tree_roots.mp4" type="video/mp4">
            </video>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 VAN GOGH ARCHIVE PROJECT</p>
    </footer>

    <script>
        // 음악 재생 인터랙션
        document.addEventListener('click', () => {
            const bgm = document.getElementById('bgm');
            if (bgm.paused) {
                bgm.volume = 0;
                bgm.play();
                let vol = 0;
                const fadeIn = setInterval(() => {
                    if (vol < 0.2) {
                        vol += 0.02;
                        bgm.volume = vol;
                    } else { clearInterval(fadeIn); }
                }, 100);
            }
        }, { once: true });

        // 스크롤 애니메이션
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('show');
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.fade').forEach(el => observer.observe(el));
    </script>
</body>
</html>
